<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Balcão - Monitoramento de Comandas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #faf8f5; color: #1a202c; font-family: sans-serif; padding: 20px; }
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .card-balcao { background-color: #ffffff; border: 2px solid #e8e2da; border-radius: 14px; padding: 18px; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.03); color: #1a202c; }
        .card-balcao.pagamento-ativo { border-color: #b38f4d; box-shadow: 0 0 15px rgba(179,143,77,0.25); background-color: #fffdf9; }
        .mesa-header { font-size: 1.2rem; font-weight: 800; color: #5c3a21; border-bottom: 2px solid #f3ede4; padding-bottom: 8px; margin-bottom: 12px; }
        .alerta-caixa { background: linear-gradient(135deg, #5c3a21 0%, #4a3221 100%); border: 1px solid #7c5335; color: #ffffff; font-weight: 800; padding: 12px; border-radius: 10px; font-size: 0.95rem; text-align: center; animation: pulsar 1.5s infinite; }
        .lista-itens-box { background-color: #faf8f5; border: 1px solid #e8e2da; min-height: 80px; }
        @keyframes pulsar { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-light">
            <h2 class="text-dark fw-bold">☕ MONITOR DE PEDIDOS - BALCÃO</h2>
            <button class="btn btn-sm btn-outline-dark fw-bold" onclick="location.href='dashboard.html'">Painel ADM</button>
        </div>
        <div id="lista-pedidos-ativos" class="grid-layout"></div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) location.href = 'login.html';

        // CONFIGURAÇÃO CENTRAL DA URL DO SEU BACKEND LOCAL
        const API_BASE = 'http://localhost:3000';

        async function carregarBalcao() {
            try {
                const res = await fetch(`${API_BASE}/api/orders/active`, { headers: { 'Authorization': `Bearer ${token}` } });
                const pedidos = await res.json();
                const container = document.getElementById('lista-pedidos-ativos');
                
                if(!pedidos || pedidos.length === 0) {
                    container.innerHTML = '<p class="text-muted text-center col-12 my-5 h5">☕ Nenhuma comanda ou mesa ativa no momento.</p>';
                    return;
                }

                container.innerHTML = pedidos.map(p => {
                    const precisaFecharConta = p.status === 'pagamento';
                    return `
                        <div class="card-balcao ${precisaFecharConta ? 'pagamento-ativo' : ''}">
                            <div class="mesa-header d-flex justify-content-between align-items-center">
                                <span>☕ MESA N° ${p.mesa}</span>
                                <span class="badge ${precisaFecharConta ? 'bg-warning text-dark':'bg-dark'}" style="font-size:0.8rem;">${p.status.toUpperCase()}</span>
                            </div>
                            <h5 class="text-dark mb-2" style="font-weight:700;">${p.cliente}</h5>
                            <div class="p-2 rounded mb-3 lista-itens-box">
                                ${p.itens.map(i => `<div class="small py-1 border-bottom border-light d-flex justify-content-between text-dark"><span>☕ ${i.qtd}x ${i.name}</span> <span class="fw-bold">R$ ${(i.price*i.qtd).toFixed(2)}</span></div>`).join('')}
                            </div>
                            <div class="d-flex justify-content-between align-items-center fw-bold text-dark mb-3">
                                <span>TOTAL COM SERVIÇO (10%):</span>
                                <span class="h4 text-success m-0 fw-bold">R$ ${p.total.toFixed(2)}</span>
                            </div>
                            
                            ${precisaFecharConta ? `
                                <div class="alerta-caixa mb-3">
                                    💵 CLIENTE SOLICITOU O FECHAMENTO!<br> LEVAR A MÁQUINA DE PAGAMENTO<br>
                                    <small class="text-warning fw-bold">Extrato por: ${p.nota} ${p.contato ? `[${p.contato}]`:''}</small>
                                </div>
                            ` : ''}

                            <button class="btn ${precisaFecharConta ? 'btn-success':'btn-outline-dark'} w-100 fw-bold py-2" onclick="mudarStatus(${p.id}, 'finalizado')">
                                ${precisaFecharConta ? '💳 Confirmar Recebimento e Liberar Mesa' : 'Encerrar Comanda Direto'}
                            </button>
                        </div>
                    `;
                }).join('');
            } catch (e) { 
                console.error("Erro ao atualizar o monitor de pedidos:", e);
            }
        }

        async function mudarStatus(id, novoStatus) {
            try {
                const res = await fetch(`${API_BASE}/api/orders/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ status: novoStatus })
                });
                
                if (res.ok) {
                    carregarBalcao();
                } else {
                    alert("Erro ao atualizar o status da comanda.");
                }
            } catch (err) {
                console.error("Erro ao enviar alteração de status:", err);
            }
        }

        // Mantém a atualização em tempo real a cada 4 segundos
        setInterval(carregarBalcao, 4000);
        carregarBalcao();
    </script>
</body>
</html>
