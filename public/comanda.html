<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comanda Digital - Controle de Mesas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
    :root { 
        --bg-clean: #fcfbf9;         /* Fundo off-white, lembra cerâmica de café */
        --card-white: #ffffff;       /* Branco puro para os painéis */
        --espresso: #3d2b1f;         /* Marrom super escuro para textos e destaques */
        --latte-cream: #f4efe9;      /* Tom de creme suave para as mesas livres */
        
        /* Cores de status elegantes e visíveis */
        --sage-green: #e6ece6;       /* Verde sálvia muito elegante para ocupado */
        --sage-text: #2f4f2f;
        --sage-border: #cbdccb;
    }

    body { 
        background: linear-gradient(180deg, #f7f4ef 0%, var(--bg-clean) 100%); 
        color: var(--espresso); 
        font-family: 'Inter', system-ui, -apple-system, sans-serif; 
        min-height: 100vh; 
        padding: 24px; 
        margin: 0;
        -webkit-font-smoothing: antialiased;
    }

    h2 { 
        font-family: 'Inter', system-ui, sans-serif; 
        font-weight: 800; 
        color: var(--espresso);
        letter-spacing: -0.03em;
        margin-bottom: 20px;
    }

    /* Painel Principal - Estilo Card Flutuante Clean */
    .card-cafeteria { 
        background: var(--card-white); 
        border: 1px solid rgba(61, 43, 31, 0.06); 
        border-radius: 20px; 
        padding: 28px; 
        box-shadow: 0 10px 30px rgba(61, 43, 31, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02); 
    }

    /* CARD DA MESA - Minimalista de Alto Contraste */
    .mesa { 
        background: var(--latte-cream); 
        color: var(--espresso); 
        border: 1px solid rgba(61, 43, 31, 0.08); 
        border-radius: 12px; 
        padding: 22px 14px; 
        font-size: 1.1rem; 
        font-weight: 700; /* Letra bem grossa para leitura perfeita */
        cursor: pointer; 
        text-align: center; 
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
    }

    /* Hover na Mesa Livre - Efeito suave de profundidade */
    .mesa:hover:not(.ocupada):not(.selecionada) {
        background: #ebe4da;
        border-color: rgba(61, 43, 31, 0.2);
        transform: translateY(-2px);
    }

    /* Mesa Ocupada - Visual "Cozy" sofisticado, super legível */
    .mesa.ocupada { 
        background: var(--sage-green); 
        border-color: var(--sage-border); 
        color: var(--sage-text); 
    }

    /* Mesa Selecionada - Destaque em Marrom Espresso com texto Branco */
    .mesa.selecionada { 
        background: var(--espresso); 
        border-color: var(--espresso); 
        color: #ffffff; /* Contraste máximo */
        transform: translateY(-2px); 
        box-shadow: 0 8px 20px rgba(61, 43, 31, 0.25);
    }

    /* Botão de Ação Principal - Sofisticado e Marcante */
    .btn-coffee { 
        background: var(--espresso); 
        color: #ffffff; 
        font-weight: 700; 
        border: none; 
        border-radius: 12px; 
        padding: 16px; 
        text-transform: uppercase; 
        letter-spacing: 0.05em;
        width: 100%; 
        transition: all 0.2s ease; 
        box-shadow: 0 4px 12px rgba(61, 43, 31, 0.15);
    }

    .btn-coffee:hover:not(:disabled) { 
        background: #271b14; /* Tom ainda mais profundo no hover */
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(61, 43, 31, 0.25);
    }

    .btn-coffee:disabled { 
        background: #e2e8f0 !important; 
        color: #94a3b8 !important; 
        box-shadow: none;
        cursor: not-allowed; 
    }
</style>





</head>
<body>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <button class="btn btn-sm btn-outline-secondary" onclick="window.location.href='dashboard.html'">☕ Menu Principal</button>
        <button class="btn btn-sm btn-light text-danger fw-bold" onclick="logout()">Sair</button>
    </div>

    <div class="card-cafeteria">
        <h2 class="text-center mb-3">☕ BEM VINDO A CAFETERIA LUGAR</h2>
        <p class="text-muted text-center small mb-4">As mesas em vermelho possuem atendimento ativo e estão bloqueadas para novos vínculos.</p>
        
        <div class="mb-4">
            <label class="form-label fw-bold">Nome do Cliente / Comanda Balcão:</label>
            <input type="text" id="nome-cliente" class="form-control form-control-lg border-2" placeholder="Ex: Amanda Lima">
        </div>
        
        <label class="form-label fw-bold mb-2">Selecione a Mesa ou Código do Balcão:</label>
        <div class="row g-2 mb-4" id="grid-mesas"></div>
        
        <button id="btn-prosseguir" class="btn btn-coffee" onclick="abrirCardapioMesa()">Abrir Nova Comanda 🥐</button>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        let mesaSelecionada = null;
        let statusServidorGlobal = {};

        async function init() {
            const grid = document.getElementById('grid-mesas');
            grid.innerHTML = '<p class="text-center text-muted col-12">Sincronizando mesas...</p>';
            
            let totalMesasConfig = 12;

            try {
                const configRes = await fetch('/api/configs/mesas', { headers: { 'Authorization': `Bearer ${token}` } });
                if(configRes.ok) {
                    const configDados = await configRes.json();
                    totalMesasConfig = configDados.total_mesas;
                }

                const statusRes = await fetch('/api/tables/status', { headers: { 'Authorization': `Bearer ${token}` } });
                if (statusRes.ok) statusServidorGlobal = await statusRes.json();
            } catch (e) { console.warn("Erro ao carregar configurações:", e); }

            grid.innerHTML = '';
            for(let i = 1; i <= totalMesasConfig; i++){
                const ocupada = !!statusServidorGlobal[i];
                const nomeCliente = ocupada ? statusServidorGlobal[i].nome : 'Disponível';

                grid.innerHTML += `
                    <div class="col-4 col-md-2">
                        <div class="mesa ${ocupada ? 'ocupada' : ''}" id="m-${i}" onclick="selecionarMesa(${i}, ${ocupada})">
                            <span class="d-block small text-muted">☕ MESA</span>
                            <strong class="d-block my-1">${i}</strong>
                            <small style="font-size: 10px; display:block; text-overflow:ellipsis; overflow:hidden; white-space:nowrap;">
                                ${nomeCliente}
                            </small>
                        </div>
                    </div>`;
            }
        }

        function selecionarMesa(n, ocupada) {
            const btn = document.getElementById('btn-prosseguir');
            const inputNome = document.getElementById('nome-cliente');
            
            mesaSelecionada = n;
            document.querySelectorAll('.mesa').forEach(m => m.classList.remove('selecionada'));
            document.getElementById(`m-${n}`).classList.add('selecionada');

            if(ocupada) {
                inputNome.value = statusServidorGlobal[n].nome;
                inputNome.disabled = true;
                btn.disabled = true;
                btn.innerText = `Mesa Ocupada por ${statusServidorGlobal[n].nome} 🛑`;
            } else {
                inputNome.value = '';
                inputNome.disabled = false;
                btn.disabled = false;
                btn.innerText = "Abrir Nova Comanda 🥐";
            }
        }

        function abrirCardapioMesa() {
            const nomeInput = document.getElementById('nome-cliente').value;
            if(!nomeInput || !mesaSelecionada) return alert("Por favor, selecione uma mesa disponível e informe o nome do cliente!");
            window.location.href = `cardapio.html?mesa=${mesaSelecionada}&cliente=${encodeURIComponent(nomeInput)}`;
        }

        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
        init();
    </script>
</body>
</html>
